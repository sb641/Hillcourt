  "household:hh_01": {grain: 34.0, firewood: 8.0, axe: 1.0}
  "household:hh_02": {grain: 40.0, firewood: 8.0, axe: 1.0}
  "household:hh_03": {grain: 26.0, firewood: 6.0, axe: 1.0}
  "household:hh_04": {grain: 36.0, firewood: 7.0, axe: 1.0}
  "household:hh_05": {grain: 36.0, firewood: 9.0, axe: 1.0}
  "household:hh_06": {grain: 20.0, firewood: 6.0, pig: 2.0, hay: 8.0}
  "household:hh_07": {grain: 32.0, firewood: 8.0, silver: 5.0}
  "household:hh_08": {grain: 34.0, firewood: 5.0, axe: 1.0}
