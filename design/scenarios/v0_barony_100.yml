settlements:
  # ЧЕТЫРЕ ПОСЕЛЕНИЯ, и каждое стоит на своём рельефе (ADR 0207). Прежние девять
  # деревень были названы по специализации, а стояли все на пятнадцати пашнях:
  # «Лесная» целиком на поле, «Мельничная» без воды, «Речная» без единой водной
  # клетки. Название без рельефа — враньё, и обвинитель на это
  # `sim/tests/test_barony_100.py::TestSpecialisation`. Специализация выражена
  # НЕ новым `Settlement.kind` (их пять, `docs/03_ontology.md`), а рельефом
  # `works_tiles`: двор работает на клетке, только если она в угодьях его поселения
  # (`docs/07_legal.md:113`).
  - id: hill_court
    name: "Город на холме"
    kind: hill_court
    at: [45, 50]
    home_terrain: hill
    holding_regime: free_holding
    # Домен сеньора: 15 пашен, работающих за трудодни (`demesne`, ADR 0182) с
    # повышенным урожаем `demesne_base_yield` 1.27. Это grain granary всего
    # баронства: 3/4 населения живут здесь и едят с домена.
    holding_tiles:
      - [47, 52]
      - [47, 53]
      - [47, 54]
      - [47, 55]
      - [47, 56]
    household_tiles: [[45, 50], [46, 50], [47, 50], [44, 51], [45, 51], [46, 51], [47, 51], [48, 51]]
    quarter_tiles: [[45, 50], [46, 50], [47, 50], [44, 51], [45, 51], [46, 51], [47, 51], [48, 51]]
    works_tiles: [[41, 52], [45, 52], [46, 52], [41, 53], [42, 53], [43, 53], [45, 53], [46, 53], [41, 54], [42, 54], [43, 54], [45, 54], [46, 54], [41, 55], [45, 55], [42, 52], [43, 52], [44, 52]]
  - id: village_forest
    name: "Лесная деревня"
    kind: village
    at: [33, 63]
    home_terrain: forest
    # ОСНОВАНИЕ: там, где лес сходится с пашней и лугом. Продукт — ДРЕВО и
    # ДИЧЬ: 16 лесных угодьев дают `cut_firewood`/`cut_wood`/`split_logs`
    # (`grow_firewood` 1.5/мес, cap 12; `grow_log` 1.2/мес, cap 36) и белку с
    # зайцем (`game_squirrel`, `game_rabbit`). 10 пашен — свой хлеб, без них
    # `villein` без кормящей клетки не загрузится; 4 луга — сено свиньям.
    household_tiles: [[31, 63], [32, 63], [33, 63], [34, 63], [35, 63], [31, 64], [32, 64], [33, 64], [34, 64], [35, 64]]
    works_tiles: [[29, 60], [30, 60], [31, 60], [32, 60], [33, 60], [34, 60], [35, 60], [36, 60], [29, 61], [30, 61], [31, 61], [32, 61], [33, 61], [34, 61], [35, 61], [36, 61], [36, 65], [37, 65], [38, 65], [39, 65], [40, 65], [41, 65], [36, 66], [37, 66], [38, 66], [39, 66], [42, 65], [43, 65], [44, 65], [45, 65]]
  - id: native_village
    name: "Племенная деревня"
    kind: native_village
    at: [85, 65]
    home_terrain: heath
    # ОСНОВАНИЕ: луг и родовая пашня. Вне книги манора (ADR 0060), оброком не
    # облагается, живёт общей землёй по `right_native_common`. Продукт — СКОТ и
    # МОЛОКО: `grow_hay` 2.0/мес, `grow_wool` 0.4/мес на 10 лугах, `pick_greens`
    # на пашне. Шесть пашен — иначе род не прокормит 18 ртов.
    household_tiles: [[83, 65], [84, 65], [85, 65], [86, 65], [87, 65], [83, 66], [84, 66], [85, 66], [86, 66], [87, 66]]
    works_tiles: [[82, 62], [83, 62], [84, 62], [85, 62], [86, 62], [82, 63], [83, 63], [84, 63], [85, 63], [86, 63], [81, 67], [82, 67], [83, 67], [84, 67], [85, 67], [81, 68]]
  - id: salt_village
    name: "Соляная деревня"
    kind: salt_village
    at: [85, 80]
    home_terrain: salt_flat
    # ОСНОВАНИЕ: солончак и торфяник. Продукт — СОЛЬ, единственный источник её в
    # баронстве: `cut_peat` (5 болот) → `boil_salt` (15 ванн, рапа `grow_brine`
    # 8.0/мес). Пашен нет вовсе: солеварня платит харчем из своего амбара, и
    # двор, умеющий пахать, просто ушёл бы в поле.
    household_tiles: [[83, 80], [84, 80], [85, 80], [86, 80], [87, 80], [83, 81], [84, 81], [85, 81], [86, 81], [87, 81]]
    works_tiles: [[81, 82], [82, 82], [83, 82], [84, 82], [85, 82], [81, 83], [82, 83], [83, 83], [84, 83], [85, 83], [81, 84], [82, 84], [83, 84], [84, 84], [85, 84], [78, 82], [78, 83], [78, 84], [78, 85], [78, 86]]

