# Баронство 100×100 — 600 ЖИТЕЛЕЙ, 150 ДВОРОВ, 4 ПОСЕЛЕНИЯ (ADR 0207).
#
# ГЛАВНОЕ ЧИСЛО ФАЙЛА. Баронство — это 600 ЖИТЕЛЕЙ, а не 600 дворов. Прежняя
# редакция объявляла 600 дворов по 2 взрослых + 1 ребёнок, то есть 1800 человек:
# карта была раздута втрое по населению и вчетверо по числу дворов. На этой цифре
# стояли замеры нескольких агентов студии и «известный долг» ACCEPTANCE §7
# («дыра 1140 зерна/мес»). Ошибка исправлена здесь и в §1a; подгонкой её не
# чинят — мир пересчитан заново.
#
# ПОЧЕМУ 4 ЧЕЛОВЕКА НА ДВОР. 600 / 150 = 4, и при `adults: 2` единственное
# разложительное соотношение — 2 взрослых + 2 ребёнка. Сценарии `start_stand`,
# `v0_shire` и `v0_two_settlements` объявляют 2 + 1 = 3 человека на двор, но это
# размер РЕГРЕССИОННОЙ ФИКСТУРЫ, а не демографическое утверждение: их дворы идут
# по одному на клетку, и лишний ребёнок там ничего не проверяет. Баронство —
# единственный мир, чей размер является продуктовым решением, поэтому оно несёт
# реальный состав ядерной семьи. Побочный эффект честный и назван: нужда двора
# растёт с 2.7 до 3.4 зерна в месяц (needs.yml: взрослый 1.0, ребёнок 0.7), а
# труд остаётся 40 трудодней — дети не дают рук. На двор приходится БОЛЬШЕ еды
# на ТОТ ЖЕ труд, то есть баланс от нового состава строже, а не мягче.
#
# ЧЕТЫРЕ ПОСЕЛЕНИЯ, и каждое стоит на своём рельефе. Прежние девять деревень были
# названы по специализации, а стояли все на пятнадцати пашнях: «Лесная» целиком
# на поле, «Мельничная» без воды, «Речная» без единой водной клетки. Название без
# рельефа — враньё, и обвинитель на это `test_barony_100.py::TestSpecialisation`.
# Специализация выражена НЕ новым `Settlement.kind` (их пять, `docs/03_ontology`),
# а рельефом `works_tiles`: двор работает на клетке, только если она в угодьях его
# поселения (`docs/07_legal.md:113`). Всё, что растёт в мире, растёт на `field`,
# `forest`, `pasture`, `marsh` и `salt_flat`; на `heath` и `water` не растёт
# НИЧЕГО (правила `grow_*` в `spawn_rules.yml` не знают этих рельефов), поэтому
# поселение на пустоши и есть поселение, которое ничего не производит.
#
#   hill_court    90  столица и зерновой амбар баронства. 23 works_tiles: 15
#                       доменных пашен под режимом `demesne` (ADR 0182) с
#                       `demesne_base_yield` 1.27, 5 бургессских свободных
#                       держаний и 3 луга. Втрое с лишним больше любой деревни —
#                       иначе замок не читается столицей. 8 кварталов по капу 20
#                       = 160 мест.
#   village_forest 24  ЛЕС: 16 лесных угодьев из 30. Продукт — древо и дичь
#                       (`cut_firewood`, `cut_wood`, `split_logs`, белка, заяц).
#                       Плюс 10 своих пашен (свой хлеб: `villein` без кормящей
#                       клетки не загрузится) и 4 луга (сено).
#   native_village 18  ЛУГ и родовая пашня: 16 works_tiles, 10 лугов и 6 пашен. СКОТ и молоко
#                       (`grow_hay`, `grow_wool`, `pick_greens`). Вне книги
#                       манора (ADR 0060), оброком не облагается, общая земля.
#   salt_village   18  СОЛОНЧАК и торфяник: 20 works_tiles, 15 ванн и 5 болот. Единственный
#                       источник соли: `cut_peat` → `boil_salt`. Пашен нет вовсе —
#                       солеварня платит харчем из своего амбара, и двор, умеющий
#                       пахать, просто ушёл бы в поле. Все 18 безземельные.
#
# МЕСТО ЕСТЬ. Кап жилых дворов — 20 на `hill_court` и 5 на сельский гекс
# (`scenario._household_cap`, ADR 0083/0132). Проверка капа обязательна: шестой
# двор на сельском гексе и двадцать первый на городском — ОТКАЗ загрузчика, а не
# «поместилось». Занято 12 городских дворов на квартал и 2–3 сельских на гекс;
# всего 310 мест при 150 дворах, то есть поздняя стадия до 200 дворов помещается
# без расширения карты. Проверка — `test_barony_100.py::TestBaronyPlacement`.
