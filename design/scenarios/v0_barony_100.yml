  - {id_prefix: hh_salt, settlement_id: salt_village, name: "Солеварный двор", count: 18, adults: 2, children: 2, legal_status: free_landless, starting_food_months: 3.0, starting_stocks: {peat: 3.0, firewood: 1.0}}

