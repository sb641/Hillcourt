  # кого, поэтому в книгу манора не входит и оброка не несёт.
  - {id: right_native_common, kind: common, holder_settlement_id: native_village, at: [82, 63]}
  - {id: right_salt_common, kind: common, holder_settlement_id: salt_village, at: [81, 82]}
  # УНАСЛЕДОВАННАЯ КНИГА ЗЕМЛИ: 20 наделов из 150 дворов. Надел с `rent_share > 0`
  # выдаётся приказом `grant_tenure` — тем же, что и приказ игрока, — поэтому у
  # таких записей нет ключа `id:` и `regime:` (ADR 0207). По книге:
  #   * лесная деревня: 6 коттеров и 6 вилланов на всех 12 пашнях
  #     пашен; коттер получает режим `cotter_plot`, виллан — `villein_tenement`;
  #   * замок: 5 бургессов на пяти `holding_tiles` поселения, генеат и 2 сокмена
  #     на трёх доменных. Сокмены платят НЕ долей: их повинность `sokeman_rent`
  #     объявляет `fixed_rent_grain_or_pence`, и `grant_tenure` при положительной
  #     доле оброчную повинность для них не заводит (ADR 0196) — это проверяется
  #     тестом, а не считается на глаз;
  #   * солеварня и племенная деревня в книгу НЕ входят: первая — наёмное
  #     предприятие, второе — чужая община по договору (ADR 0060).
