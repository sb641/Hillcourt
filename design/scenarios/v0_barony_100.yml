starting_stocks:
  "tile:t_72_15": {log: 12.0, stone: 12.0}  # пни и камень под выкорчёвку
  # Амбар КОРНЕВОГО манора — это `settlement:hill_court` (`Manor.stock_id`), тот же
  # склад, что читают `grant_grain`, `grant_tool` и `engine/roadworks.py::start_work`.
  # `log` и `iron` положены сюда НАЧАЛЬНЫМ СОСТОЯНИЕМ (ADR 0215 §Дыра 1), и это
  # названо прямо, а не спрятано: **механического пути бревна и железа в амбар лорда
  # в мире нет**. Замер 24 мес, сид 4242, ДО правки: `log` в амбаре 0.0, `iron` 0.0,
  # `iron_bloom` 0.0, `iron_share` 0.0 — при том, что бревна в мире есть (1 151.6
  # `log` в стоках клеток, спавн `grow_log`) и железо есть (17.1 `iron`, рецепт
  # `mine_iron` на топях). Между ними нет провода: `economy/labor.py::apply_recipe`
  # пишет выход в сток ИСПОЛНЯЮЩЕГО ДВОРА, и в амбар манора выход идёт только из
  # `economy/manor.py::_work_demesne` для `harvest_grain`. Правка этого — зона
  # Economist (ADR 0195 §1, долг открыт), здесь она не делается и не имитируется.
  #
  # Числа — по цене приказа, а не «сколько не жалко»:
  #   `log 18.0` = четыре дороги (4 × 3.0) и по одному броду и мосту (2.0 + 4.0)
  #     при ценах `MATERIAL_AMOUNT` (ADR 0039);
  #   `iron 3.6` = ровно три железных лемеха по 1.2 (`smith_iron_share`).
  # `iron_bloom` и `iron_share` сюда НЕ кладутся: в мире их ровно 0.0 (замер выше),
  # и класть начальное состояние для товара, который нигде не производится, значит
  # выдумать рецепт. Это зафиксированный долг (ADR 0215 §Долг), а не починка.
  settlement:hill_court: {grain: 40.0, firewood: 10.0, cart: 1.0, log: 18.0, iron: 3.6}
  # Амбар солеварни — запас сеньора. 50 работников харча `monthly_food_need`
  # (2 взрослых + ребёнок) = 2.7 зерна на двор = 135.0 в месяц, значит 3960.0 —
  # 29 месяцев полного харча. Запас КОНЕЧЕН и добрать его нечем: приказа «наполнить
  # склад поселения» в `PlayerAction` нет (заявка в отчёт Implementer, ADR 0207).
  # Прежние 30.0 зерна — это ровно один месяц харча, после чего `_saltworks_job`
  # возвращал None, выварка не шла, и обоз соли был мёртв (соль 0.0).
  # Амбар солеварни — харч наёмных рук. 10 работников по 3.4 зерна
  # (needs.yml: 2 взрослых + 2 ребёнка) = 34.0 в месяц, значит 1020.0 —
  # 30 месяцев полного харча. Запас КОНЕЧЕН и добрать его нечем: приказа
  # «наполнить склад поселения» в `PlayerAction` нет (заявка в отчёт, ADR 0207).
  # Прежние 30.0 зерна — это меньше месяца харча, после чего `_saltworks_job`
  # возвращал None, выварка не шла, и обоз соли был мёртв: соль в замке 0.0.
  # Амбар солеварни — харч наёмных рук. 18 работников по 3.4 зерна
  # (needs.yml: 2 взрослых + 2 ребёнка) = 61.2 в месяц, значит 2203.2 —
  # 36 месяцев полного харча. Запас КОНЕЧЕН и добрать его нечем: приказа
  # «наполнить склад поселения» в `PlayerAction` нет (заявка в отчёт, ADR 0207).
  # Прежние 30.0 зерна — это меньше месяца харча на 18 ртов, после чего
  # `_saltworks_job` возвращал None, выварка не шла, и обоз соли был мёртв:
  # соль в замке 0.0.
  settlement:salt_village: {grain: 2203.2, cart: 1.0}

script:
