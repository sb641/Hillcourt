  # Столица: 90 дворов = 360 человек. Втрое с лишним больше любой деревни, иначе
  # замок не читается столицей. 8 кварталов по капу 20 = 160 мест, занято 12 на
  # квартал: запас есть, поздняя стадия до 200 дворов влезает без новой карты.
  - {id_prefix: hh_city_court, settlement_id: hill_court, name: "Городской двор", count: 1, adults: 2, children: 2, legal_status: holder, starting_food_months: 3.0}
  - {id_prefix: hh_hill_geneat, settlement_id: hill_court, name: "Генеат свиты", count: 1, adults: 2, children: 2, legal_status: geneat, starting_food_months: 3.0, starting_firewood_months: 3.0, starting_stocks: {axe: 1.0}}
  - {id_prefix: hh_hill_sokeman, settlement_id: hill_court, name: "Сокмен свиты", count: 2, adults: 2, children: 2, legal_status: sokeman, starting_food_months: 3.0, starting_firewood_months: 3.0, starting_stocks: {axe: 1.0}}
  - {id_prefix: hh_city, settlement_id: hill_court, name: "Квартальный двор", count: 86, adults: 2, children: 2, legal_status: villein, starting_food_months: 3.0}
  # Лесная деревня: 24 двора = 96 человек, 18 вилланов на домене и 6 коттеров на
  # отведённых наделах. Скота нет: луг кормит только тех, у кого он свой.
  - {id_prefix: hh_village_forest, settlement_id: village_forest, name: "Лесной двор", count: 18, adults: 2, children: 2, legal_status: villein, starting_food_months: 3.0}
  - {id_prefix: hh_village_forest_cotter, settlement_id: village_forest, name: "Лесной клочок", count: 6, adults: 2, children: 2, legal_status: cotter, starting_food_months: 3.0, livestock_every: 3, livestock: {pig: 2.0, hay: 8.0}}
  # Племенная деревня: 18 дворов одного рода = 72 человека, все безземельные под
  # общинным правом. Род не растёт делением, поэтому деревня мала — и именно этим
  # она и опасна: при 8 домах сеньор может купить её, при 50 пришлось бы воевать.
  - {id_prefix: hh_native, settlement_id: native_village, name: "Племенной двор", count: 18, adults: 2, children: 2, legal_status: free_landless, starting_food_months: 3.0, livestock_every: 6, livestock: {pig: 2.0, hay: 8.0}}
  # Солеварня: 18 безземельных наёмных рук = 72 человека. Единственный товар
