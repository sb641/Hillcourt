version: 0
id: hillcourt_art_grid_v0
name: Рабочая сетка визуальных ассетов HILLCOURT

grid:
  topology: axial_hex
  layout: odd_r
  neighbor_count: 6
  reference_projection: isometric_2to1
  target_render_mode: flat_2d_plate
  projection_frozen: false
  logical_cell_canvas_px: [128, 128]
  reference_ground_mask_px: [128, 64]
  reference_ground_anchor_px: [64, 80]
  final_hex_anchor_px: pending_flat_2d_proof
  proof_tile_center_px: [64, 64]
  proof_hex_center_px: [64, 64]
  proof_hex_circumradius_px: 48
  proof_hex_half_width_px: 42
  anchor_note: >-
    Three distinct reference points, not one disagreement.
    reference_ground_anchor_px is the isometric reference ground centre.
    proof_tile_center_px is where a flat 2D object stands inside its own tile,
    and it is the same pixel as proof_hex_center_px because the object stands
    in the middle of the tile. None of them is final while camera_frozen is
    false. See docs/decisions/0173_flat2d_proof_mask_and_anchor.md.
  guide_cell_canvas_px: [256, 192]
  layers:
    - terrain_base
    - water_and_wetland
    - roads_and_contact_shadows
    - fields_and_gardens
    - rear_structures_and_background
    - front_structures
    - infrastructure
    - props_and_resources
    - actors_and_animals
    - smoke_fire_water_effects
    - knowledge_render_state
  visual_render_states:
    - observed
    - unknown
  knowledge_cues:
    - observed
    - unknown
    - silence

game_contract:
  terrain_ids: [hill, field, pasture, forest, marsh, heath, salt_flat, ruin, water]
  settlement_kinds: [hill_court, farmstead, salt_village, village, native_village]
  rural_household_cap: 5
  urban_household_cap: 20
  barony_cell_count: 10000
  barony_water_cell_count: 200
  initial_ford_count: 3
  initial_bridge_count: 2
  current_markers: [trail, mooring, waystation, tavern, mine, castle, urban, hermitage, smoke, lost_caravan]
  movement_profiles: [caravan, foot, hunters, mounted, arms, rider, water_raft, water_boat]
  scout_profiles: [hunters, forester, party]
  report_sources: [eye_from_hill, adjacent_daily, messenger, scout, caravan, silence]
  prohibited_actor_ids: [Knight, Explorer]

