version: 0
id: hillcourt_asset_library_v0
name: Библиотека игровых ассетов HILLCOURT

atlas_contract:
  cell_canvas_px: [128, 128]
  anchor_px: [64, 80]
  background: transparent
  guide_background: "#10242a"
  guide_cell_canvas_px: [192, 192]
  status_values: [crop_reference, composition_reference, needs_isolation, needs_ontology_check, concept_only]
  final_claims: false
  client_frozen: true
  camera_frozen: false
  target_render_mode: flat_2d_plate
  reference_projection: isometric_2to1
  knowledge_states_frozen: true

supporting_manifests:
  - id: terrain_atlas_v0
    name: Terrain source atlas
    file: terrain_manifest.yml
  - id: supported_goods_props_v0
    name: Supported goods and props
    file: supported_goods_props_manifest.yml
  - id: actor_pose_reference_v0
    name: Actor pose references
    file: actor_pose_reference_manifest.yml
  - id: architecture_v1
    name: Clean architecture v1
    file: ../asset_library_v1/architecture/architecture_manifest.yml
  - id: goods_props_v1
    name: Supported goods and props v1
    file: ../asset_library_v1/items/goods_manifest.yml
  - id: actors_v1
    name: Actor library v1
    file: ../asset_library_v1/actors/actors_manifest.yml
  - id: terrain_edges_v1
    name: Terrain edge and transition prototypes
    file: ../asset_library_v1/terrain/terrain_edge_manifest.yml
  - id: flat2d_proof_v0
    name: Flat 2D production proof
    file: ../flat2d_proof/flat2d_proof_manifest.yml

