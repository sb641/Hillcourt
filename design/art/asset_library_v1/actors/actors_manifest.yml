version: 0
id: hillcourt_actor_library_v1
name: Actor library v1

atlas:
  file: asset_library_v1/actors/actors_atlas_v1.png
  guide: asset_library_v1/actors/guides/actors_guide_v1.png
  plate_dir: asset_library_v1/actors/plates
  columns: 5
  cell_canvas_px: [128, 128]
  anchor_px: [64, 80]
  background: transparent
  status: mixed_reference_and_drawn
  animation_claim: false
  previous_status: clean_pose_reference

# The three drawn figures are identified by `Person.age_class`, which docs/03
# fixes as exactly {child, adult, elder} and which the simulation reads in
# demography, needs, decisions, manor, seat and thegn. That is a data carrier -
# it says what the plate depicts. It is not a sprite selector: nothing in sim/
# picks a plate from it. See ADR 0180.
#
# The five reference cells below have no carrier: there is no `pose`, `stance`,
# `occupation` or carried-item field anywhere in the ontology, and
# `Household.main_action` is a household decision, not a per-person pose. A
# plate nobody can select is a picture, so they stay references and are listed
# as excluded in the proof manifest.
drawn_figures:
  manifest: flat2d_proof/flat2d_proof_manifest.yml
  verifier: flat2d_proof/verify_proof.py
  anchor_px: [64, 64]
  data_carrier: Person.age_class
  data_carrier_kind: declared_field
  sprite_selector: none
  data_carrier_note: >-
    Person.age_class is a data carrier: it identifies the depicted entity and
    the simulation reads it. It is NOT a sprite selector. No code in sim/ picks
    a plate from it, because client/ is frozen; see
    docs/decisions/0180_data_carrier_is_not_a_sprite_selector.md.

cells:
  - id: actor_child
    name: Child figure
    game_entities: [Person]
    data_carrier: Person.age_class
    data_carrier_kind: declared_field
    carrier_value: child
    flat_2d_plate: flat2d_proof/plates/actor_child.png
    status: drawn_flat_2d
  - id: actor_adult
    name: Adult figure
    game_entities: [Person]
    data_carrier: Person.age_class
    data_carrier_kind: declared_field
    carrier_value: adult
    flat_2d_plate: flat2d_proof/plates/actor_adult.png
    status: drawn_flat_2d
  - id: actor_elder
    name: Elder figure
    game_entities: [Person]
    data_carrier: Person.age_class
    data_carrier_kind: declared_field
    carrier_value: elder
    flat_2d_plate: flat2d_proof/plates/actor_elder.png
    status: drawn_flat_2d
  - id: pose_reference_01
    name: Actor pose reference 01
    game_entities: [Person, Household]
    source_plate: actor_villager_a
    status: reference_no_carrier
    data_carrier: null
    sprite_selector: none
    carrier_note: >-
      No pose, stance or occupation field exists in the
      ontology, so no field identifies this plate.
  - id: pose_reference_02
    name: Actor pose reference 02
    game_entities: [Person, Household]
    source_plate: actor_villager_b
    status: reference_no_carrier
    data_carrier: null
    sprite_selector: none
    carrier_note: >-
      No pose, stance or occupation field exists in the
      ontology, so no field identifies this plate.
  - id: pose_reference_03
    name: Actor pose reference 03
    game_entities: [Person, Household]
    source_plate: actor_villager_c
    status: reference_no_carrier
    data_carrier: null
    sprite_selector: none
    carrier_note: >-
      No pose, stance or occupation field exists in the
      ontology, so no field identifies this plate.
  - id: pose_reference_04
    name: Actor pose reference 04
    game_entities: [Person, Household]
    source_plate: actor_villager_d
    status: reference_no_carrier
    data_carrier: null
    sprite_selector: none
    carrier_note: >-
      No pose, stance or occupation field exists in the
      ontology, so no field identifies this plate.
  - id: actor_retainer_equipment
    name: Retainer equipment reference
    game_entities: [Person, Pack]
    source_plate: actor_retainer_equipment
    status: reference_no_carrier
    data_carrier: null
    sprite_selector: none
    carrier_note: >-
      Pack.profile_id carries hunters/forester/party, but no
      field anywhere carries a shield, a spear or any other
      carried item, so retainer equipment has no selector.
# Clothing, seven layers, drawn on the same body landmarks as the figures so
# a layer is an overlay and not a second person. `Household.legal_status_id` is
# the carrier: a declared field, read by the simulation. No field was added.
# The wealth steps order that same field. See ADR 0187.
clothing:
  carrier_field: Household.legal_status_id
  sprite_selector: none
  layers: [armour, feet, head, legs, outer, rank, tunic]
  status_to_armour_step:
    cotter: 0
    free_landless: 0
    geneat: 1
    holder: 2
    slave: 0
    sokeman: 1
    thegn: 2
    villein: 0
  note: >-
    The armour steps are three, not eight: no armour, leather byrnie, mail
    byrnie. All eight legal statuses are placed on the three explicitly, so
    none is left to guesswork. Plate armour is deliberately absent - it is the
    fourteenth century and MOODBOARD.md forbids it.
  age_classes: [child, adult, elder]
  age_note: >-
    A layer is drawn once per body. `Person.age_class` is a real carrier, so the
    body is part of the key and `body_id` says which figure each plate overlays.
    Sixteen adult-only plates would have left a child of a thegn drawn in the
    thegn's silk, cut to the thegn's hem, on a body two thirds of the height: a
    garment that fitted nobody, with every plate in the file individually correct.
  plates:
    - id: garment_armour_leather_adult
      name: Leather byrnie (adult)
      status: drawn_flat_2d
      material_layer: armour
      material_wealth_step: 1
      material_age_class: adult
      body_id: actor_adult
      form: armour_byrnie
      flat_2d_plate: flat2d_proof/plates/garment_armour_leather_adult.png
    - id: garment_armour_leather_child
      name: Leather byrnie (child)
      status: drawn_flat_2d
      material_layer: armour
      material_wealth_step: 1
      material_age_class: child
      body_id: actor_child
      form: armour_byrnie
      flat_2d_plate: flat2d_proof/plates/garment_armour_leather_child.png
    - id: garment_armour_leather_elder
      name: Leather byrnie (elder)
      status: drawn_flat_2d
      material_layer: armour
      material_wealth_step: 1
      material_age_class: elder
      body_id: actor_elder
      form: armour_byrnie
      flat_2d_plate: flat2d_proof/plates/garment_armour_leather_elder.png
    - id: garment_armour_mail_adult
