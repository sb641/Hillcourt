# Camp plates. Written by hand - keep the inline style, do not round-trip
# this through yaml.safe_dump.
version: 0
id: camps_v0
name: Camps, one plate per tile_view camp form
note: 'A camp is a DERIVED VIEW FORM, not an entity: `tile_view.camp_form()` (tile_view.py:643)
  returns the form from `pack.kind`, the owner''s legal status and the head count, through
  `inbound_packs()`. That is why the carrier here is the field the code branches on, and
  why ADR 0190 was wrong to say a camp cannot be drawn - I judged from the ontology and
  never opened tile_view.py.

  `camp_lost_caravan` is not a Pack in transit at all: it is a named tile mark read through
  `getattr(tile, mark, False)` (tile_view.py:764), so its carrier is `optional_attribute`,
  not a declared dataclass field.'
sprite_selector: none
reachable_forms_source: sim/src/hillcourt/engine/tile_view.py::camp_form_for_pack
cells:
