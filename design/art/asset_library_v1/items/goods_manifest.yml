# The drawn plates live in the proof tree, because that is the only place where
# geometry is machine-checked. A plate that is not verified there is a picture.
flat_2d_proof:
  manifest: flat2d_proof/flat2d_proof_manifest.yml
  verifier: flat2d_proof/verify_proof.py
  mutation_test: flat2d_proof/mutation_test.py
  anchor_px: [64, 64]
  data_carrier: Good.id
  data_carrier_kind: declared_field
  sprite_selector: none
  data_carrier_note: >-
    Good.id identifies the depicted good and the catalog is loaded from it, so
    the mapping is checkable. It is not a sprite selector - no code picks a
    plate per good while client/ is frozen. See ADR 0180.
  note: >-
    The proof anchor is 64,64. The isometric reference anchor 64,80 declared
    above is a different point and is used by no flat 2D plate.
  good_catalog_check: >-
    Every id in game_goods was checked against design/catalogs/goods.yml and
    exists there. salt, peat, grain, wool, log, boat, cart and iron are all
    catalog goods, so no plate in this file is an object without matter behind
    it.

# Livestock. Nine plates for nine species; the sex and age keys in
# needs.yml are the same animal at a different size, so each plate declares
# which catalog goods it serves. Without that declaration the runtime has
# to choose between `horse` and `horse_foal`, and nothing says how.
# validate_mapping.py requires every key in needs.yml's feed table to be
# served by exactly one plate, in both directions. Every key in
# design/catalogs/needs.yml livestock.feed_per_month must be served by exactly
# one plate above, and every good in serves_goods must exist in goods.yml.
livestock:
  - id: animal_donkey
    name: Donkey
    status: drawn_flat_2d
    form: quadruped
    serves_goods: [donkey_m, donkey_f, donkey_foal]
