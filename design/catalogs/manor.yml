# Манор: чем кормится право. Владелец: Economist.
# Здесь только экономика: размеры наделов, труд домена по сезонам, паёк, найм,
# посев. Кто МОЖЕТ и ЧТО ДОЛЖЕН — задаёт Legal (legal_statuses.yml,
# obligations.yml, calendar_v0.yml); этот файл переводит их условия в тик.
#
# Единицы: см. design/catalogs/README.md и design/review/manor_accounts_v0.md.
#   tile_plot  — 1 полевая клетка = 1 виргата (30 акров); гайда = 4 клетки.
#   labor-day  — трудодень взрослого; взрослый = 20 трудодней/месяц.
# Сезонную барщину (сколько дней двор отдаёт домену) читаем из calendar_v0.yml;
# сезонную урожайность (что даёт оставшийся труд) — из seasons.yml.
version: 1
plots:
  tile_plot_acres: 30
  hide_acres: 120
  # Надел двора в клетках (holding_scale): сколько поля он реально тянет.
  holding_tiles_by_land_kind:
    villein_tenement: 1.0
    cotter_plot: 0.5
    free_holding: 1.0
    demesne: 0.0
    waste: 0.0
  # Ёмкость СТОЙЛА скота (дойка/выпас), не пашни: потолка партий на гекс пашни
  # не существует (ADR 0137) — сколько снимет уборка, решают труд и standing.
  plot_batch_cap_per_tile: 4
demesne:
  # Сколько трудодней в месяц принимает 1 клетка домена (сев/прополка/жатва).
  # Спрос широкий: в сезон уборки на баронову пашню выходит вся деревня
  # (ADR 0173, 0137 п. 5), и предел спроса не душит урожай.
  # ПОТОЛКА УРОЖАЯ НЕТ ВОВСЕ (ADR 0137 п. 2): сколько снимет уборка, решают труд
  # и стоячая материя клетки. Полосы выхода как нормы тоже нет — она была моей
  # ошибкой и отменена (ADR 0142; реестр отмен — ADR 0143): числа-ориентиры
  # остались в ADR как нижняя граница шкалы, но НОРМОЙ и требованием не являются.
  # НОРМА ВЫХОДА — не здесь, а в `spawn_rules.yml::grow_grain.params.demesne_base_yield`
  # (1.27), потому что её читают и рост, и жатва. Арифметика этой нормы:
  # 1458 трудодней/год = 72.9 партии по 20 дней, Σ(спрос × demesne_yield) = 1024.3,
  # выход 5.0 зерна/партию → 256.1 при базе 1.0, ×1.27 = 325.2. Прибавки клетки
  # (инструмент, тягло, навоз, смена полей) считаются РОВНО ОДИН РАЗ на партию.
  # Полный спрос гекса (1458 трудодней/год) требует 13.3 работника в пике
  # (август-сентябрь: 266 трудодней/мес). Меньше работников — меньше зерна, и
  # тогда считается при базе 1.27: 4 работника (80/мес) дают 164.7,
  # 8 (160/мес) — 257.8, 8.7 (174/мес) — 269.7. Недобор закрывается наймом,
  # а не магией: спрос на труд догоняет урожай, а не наоборот.
  demand_days_per_tile: {1: 30, 2: 30, 3: 114, 4: 114, 5: 114, 6: 171, 7: 171, 8: 266, 9: 266, 10: 76, 11: 76, 12: 30}
  # Рецепт, которым домен снимает урожай; выход идёт в сток замка.
  harvest_recipe: harvest_grain
board:
  # Паёк из стока замка (unit зерна на взрослого в месяц) по пресету.
  grain_per_adult_by_status:
    slave: 1.0
    holder: 1.0
    thegn: 1.0
hire:
  # Найм свободного без земли: еда/пенс за трудодень, только если домен не закрыт
  # барщиной и у замка есть зерно/серебро. Цена — из бандла Legal по смыслу.
  wage_grain_per_day: 0.12
  wage_silver_per_day: 0.02
  min_castle_grain: 1.0
sow:
  # Гэфоль-пахота: зерно двора на поле домена в sow-месяцы (10–11).
  grain_per_acre: 1.0
