# Каталог рецептов. Владелец: Economist.
# Баланс каждой партии: sum(inputs) + sum(draws_standing) == sum(outputs) + sum(loss).
#   inputs          — списывается со стока двора;
#   draws_standing  — списывается со стоячей материи клетки (Tile.standing);
#   outputs         — идёт в сток двора;
#   loss            — уходит в sink:waste.
# `draws_standing` не создаёт материю: правило появления даёт её в phase_growth.
# Рецепт без выхода товара, которого не было на входе, обязан иметь transform: true.
# Труд: labor_days — трудодни на одну партию при масштабе 1.
# Единицы: см. design/catalogs/README.md («Единицы»).
#
# ===== РЕЕСТР СТАТУСА ПОЛЕЙ recipes.yml (ADR 0192) =====
# Пять значений, смысл и приборы — в шапке `goods.yml` (реестр один на каталог,
# читается одинаково). Коротко: `live` — читает расчёт; `checked` — защищено
# загрузчиком или тестом; `witness` — доказательство происхождения; `reserved` —
# объявлено как намерение, исполнения нет; `superseded` — вытеснено поздним
# законом. Проверяет `test_catalog_rules` (pass 2, вместе с парсером).
# Пока `reserved` не погашен, поле обязано остаться необязательным у загрузчика.
#
# поле | статус | прибор | основание
# id | live | сортировка/журнал: идентификация, не механика | —
# name | live | подписи в отчётах и вестях | —
# place | live | economy/labor::_tiles_for_recipe, apply_recipe | ADR 0106
# requires_terrain | live | economy/labor::_tiles_for_recipe | ADR 0106
# inputs | live | economy/labor::apply_recipe → Ledger.transfer | ADR 0106
# draws_standing | live | economy/labor::apply_recipe → Ledger.transfer | ADR 0106
# outputs | live | economy/labor::apply_recipe → Ledger.emit | ADR 0106
# loss | live | economy/labor::apply_recipe → Ledger.emit → sink:waste | ADR 0106
# labor_days | live | economy/labor::_apply_set, сезонный бюджет двора | ADR 0106
# transform | checked | test_catalog_rules::test_recipes (запрет) | ADR 0001:68
# tool_multiplier | reserved | цитата есть, чтений 0, значений 0 из рецептов | ADR 0106:20-21
