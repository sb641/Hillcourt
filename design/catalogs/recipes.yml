  # Скот и тягло (ADR 0025). Приплод: самец + самка одного вида в одном стоке
  # (двор или амбар) и сено дают редкий молодняк в тике — не ферма-кликер.
  # Родители — условие, а не вход: кобыла не исчезает, телёнок рождается из сена
  # (4 сена = 1 молодняк + 3 потерь). Взросление: молодняк + сено → взрослый
  # (1 + 2 = 1 + 2 потерь); пол — жребием в тике. labor_days номинален
  # (каталог требует > 0): фаза скота труд не списывает, процесс пассивный.
  - id: breed_ox
    name: Приплод волов
    place: settlement
    requires_terrain: []
    inputs: {hay: 4.0}
    draws_standing: {}
    outputs: {ox_calf: 1.0}
    loss: {hay: 3.0}
    labor_days: 2
    transform: true
  - id: breed_donkey
