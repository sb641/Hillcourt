  # РАСЧИСТКА ЛЕСА (ADR 0175). Операция ВЫКОРЧЁВКИ: с клетки снимается стоячая
  # древесина (пни, корни) и выбирается камень из земли. Лес остаётся лесом —
  # `terrain` не меняется (граница v0 из design/review/clearing_and_yards_design.md).
  # Бревно двор берёт отдельно, рецептом `cut_wood`; здесь всё снятое бревно
  # уходит в потери — пни, корни, опилки и негодная древесина товаром не
  # становятся. Потери читаются из УЧТЁННОЙ стоячей материи клетки, а не из
  # воздуха: 12.0 + 12.0 = 9.6 + 12.0 + 2.4 = 24.0. `transform: true`, потому
  # что камень на входе не объявлен.
  #
  # ТРУД 60 ТРУДОДНЕЙ = 3 МЕСЯЦА ВЗРОСЛОГО (норма 20 трудодней в месяц), и это
  # не украшение: `goods.yml::stone.price_*` выведены ИЗ ЭТОГО ЧИСЛА
  # (`60 / 9.6 × 0.02 = 0.125000`). Смена `labor_days` без пересчёта
  # `goods.yml::stone.price_*` разрывает каталог сам с собой и роняет тест
  # `test_catalog_rules::TestClearingGivesLogsAndStone`.
