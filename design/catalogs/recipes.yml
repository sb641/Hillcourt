  # ЛЕСТНИЦА МАТЕРИАЛА (ADR 0106 п. 3, ADR 0157): бревно → доска → планка, ниже не
  # спускаемся — гвозди, рукояти, скобы остаются `concept_only`. Числа перенесены
  # из кода без изменения: `log 1.05 → board 1.0`, `board 1.05 → plank 1.0`, потери
  # 5 % входа. `transform: true`, потому что выход (board/plank) на входе не
  # объявлен. Имена — по образцу соседей: работа-существительное без цели
  # («Колка брёвен», «Резка торфа»). Потребителя планки в v0 нет (ADR 0150) — это
  # не дыра: место хранения `barn`, рецепт и производство есть (И-7), планка лежит.
