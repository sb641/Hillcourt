# Каталог товаров. Владелец: Economist.
# Единица: 1 условная единица массы (unit). Соизмеримость и перевод единиц —
# см. design/catalogs/README.md, раздел «Единицы».
# Поля: id, name (рус), category, storage, spoil_per_month, edible, nutrition.
#   category ∈ {food, fuel, material, lux, livestock}
#   storage  ∈ {granary, cellar, barn, pack, open}
#   nutrition — сколько «ртов-единиц» кормит 1 unit товара (только для edible).
#
# ЦЕНЫ (ADR 0101). Поля price_labor_silver, price_materials_silver,
# price_losses_silver, price_silver — серебро за ОДНУ единицу хранения (`unit`),
# то есть ровно за 1.0 в складе. Пуд (16.38 кг) единицей хранения НЕ является: масса
# unit закреплена паётом (`needs.yml food.adult_per_month: 1.0` = месячный рацион
# взрослого, историческая норма ≈ 1 кг зерна в день → 30 кг), поэтому
# цена за кг = цена за unit / 30, цена за пуд = цена за кг × 16.38. Единица и оба
# перевода запинены тестом `sim/tests/test_price_table.py`.
# Формула: цена = (трудозатраты + сырьё и потери) × коэффициент дефицита (1.1…1.3).
#   price_labor_silver     = labor_days рецепта(ов) на 1 unit × wage_silver_per_day
#                           (manor.yml hire) — по всем рецептам, выпускающим товар;
#   price_materials_silver = входы на 1 unit по СЕБЕСТОИМОСТИ (труд+сырьё+потери
#                           входа), не по рыночной цене: цена в цене запрещена;
#   price_losses_silver    = потери рецепта на 1 unit по той же полной себестоимости
#                           (потерянный товар стоил столько же, сколько выпущенный);
#   price_silver           = сумма трёх полей × коэффициент (дефицит повышает).
# Животные (pig, hen, duck, goose) цены не имеют: рецепты разведения замкнуты (вход —
# взрослое животное), цена взрослого = годовой корм needs.yml livestock.feed_per_month.
# Без полного пути (И-7) цены не имеют: brine, straw, cloth, iron_bloom, war_kit,
# cart, raft, boat, wooden_plough, iron_share.
# Уровень обоснован покупательной способностью: дневная ставка 0.02 серебра покупает
# 4.7 кг зерна (Англия 1300–1400: заработок 1.5–2.5 пенса/день, пшеница 9.21 шил./квартал
# ≈ 0.41 пенса/кг → 5–10 кг/день; Clark 2003, Farmer 1988/1991, LSE WP360/WP375).
# Соль 4.0× зерна (историческая надбавка 3–10×), оброк сокемана 0.6 зерна = 0.077
# серебра = 3.8 дневных ставок. Серебро — единица счёта, цена 1.0.
#
# ===== РЕЕСТР СТАТУСА ПОЛЕЙ goods.yml (ADR 0192) =====
# Статус отвечает на ОДИН вопрос: **чем это поле защищено, если его не читает
# расчёт.** Пять значений, и ни одного шестого:
#   live        — читается расчётом в sim/src. Прибор: счёт чтений > 0.
#   checked     — расчётом не читается, но защищено прибором: загрузчиком
#                 (закрытый перечень) или тестом (правило/запрет).
#   witness     — расчётом не читается by design: это доказательство происхождения,
#                 которое читают человек и тест. Прибор: тест, сверяющий с формулой.
#   reserved    — объявлено и **цитируется как намерение**, исполнения нет.
#                 Прибор: цитата в реестре решений + отсутствие чтений.
#   superseded  — вытеснено более поздним законом, осталось в данных. Прибор: номер
#                 вытесняющего ADR.
# Статус стоит у ПОЛЯ, а не у записи, поэтому живёт здесь, а не в каждой записи:
# иначе это 55 новых мёртвых столбцов, ровно тот брак, который реестр лечит.
# Читается реестр так: `test_catalog_rules` сверяет его с ключами `_parse_goods`
# и со счётом чтений по AST, и ПАДАЕТ при несовпадении (pass 2, вместе с
# парсером: до него статус — запись, после — прибор).
# ГРАНЦИА ПРАВИЛ: **основание обязательно для `checked`, `witness`, `reserved`
# и `superseded`** — это ссылка на закон, и без неё такая запись пустая. Для
# `live` основание необязательно: там основание — сам код, и кто читает поле,
# названо в графе «прибор»; настоящая ссылка на закон, если она есть, тоже
# годится. Проверка за два прогона нашла эту нестыковку в обе стороны: сначала
# потребовала цитату от `live`, где я законно написал «—», потом запретила цитату
# там, где она настоящая. Оба раза неверным было правило, а не реестр — и это
# ровно то, ради чего прибор нужен: он спорит не с данными, а с формулировкой.
#
# ЧТО ДЕЛАТЬ, ЕСЛИ КТО-ТО ПРОЧТЁТ ПОЛЕ `reserved`: ничего не запрещено, но
# чтение **погашает заготовку** — в том же проходе статус меняется на `live`, и в
# реестр вписывается основание (номер ADR). Пока не погашено, `reserved`-поле
# обязано оставаться НЕобязательным у загрузчика: иначе отсутствие значения
# уронит каждую загрузку, и это будет уже не заготовка, а брак.
#
# поле | статус | прибор | основание
# id | live | сортировка/журнал: идентификация, не механика | —
# name | live | подписи в отчётах и вестях | —
# category | live | economy/labor: различает еду для стойла и для рта | —
# storage | checked | И-7 требует НАЛИЧИЯ; test_catalog_rules::test_goods | 00_constitution.md:43
# spoil_per_month | live | engine/tick::phase_spoil | —
# edible | live | economy/needs: что идёт в рот | —
# nutrition | live | economy/needs: рот-единицы на 1 unit | —
# price_silver | live | economy/exchange::price_of (6 вызовов) | ADR 0101
# price_labor_silver | witness | test_price_table::test_price_is_per_storage_unit_and_derived_from_recipes | ADR 0144:12
# price_materials_silver | witness | test_price_table (тот же) | ADR 0144:12-13
# price_losses_silver | witness | test_price_table (тот же) | ADR 0144:12-13
